plugins { id 'com.android.application' }

android {
    namespace 'org.snaplivre.app'
    compileSdk 35
    defaultConfig {
        applicationId 'org.snaplivre.app'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.0.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64', 'x86' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging {
        jniLibs { useLegacyPackaging true }
        resources { excludes += ['META-INF/LICENSE*', 'META-INF/NOTICE*'] }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.debug } }
    splits { abi { enable true; reset(); include 'arm64-v8a', 'armeabi-v7a', 'x86_64', 'x86'; universalApk true } }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
